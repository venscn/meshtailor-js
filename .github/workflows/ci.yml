name: mesh-core-and-imports
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check
      - run: npm run test:core
      - run: npm run test:complex
      # The browser suite additionally requires a Chromium executable.
